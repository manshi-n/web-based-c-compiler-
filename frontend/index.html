<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Based C Compiler</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#000;
    color:white;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Main Container */
.container{
    text-align:center;
    max-width:700px;
}

/* Title Style */
.title{
    font-size:50px;
    font-weight:700;
}

.title span{
    color:#00ffcc;
    text-shadow:0 0 10px #00ffcc;
}

/* Subtitle */
.subtitle{
    margin-top:10px;
    font-size:18px;
    color:#ccc;
}

/* Glass Card */
.glass{
    margin-top:30px;
    padding:25px;
    border-radius:15px;
    background: rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    line-height:1.6;
    animation: float 4s ease-in-out infinite;
}

/* Button */
.btn{
    margin-top:25px;
    padding:14px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    background:#00ffcc;
    color:black;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #00ffcc;
}

/* Floating animation */
@keyframes float{
    0%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
    100%{ transform:translateY(0); }
}
</style>
</head>

<body>

<div class="container">

    <!-- Heading -->
    <div class="title">
        💻 <span>Web Based</span><br> C Compiler
    </div>

    <div class="subtitle">
        Code. Analyze. Improve.
    </div>

    <!-- Info Box -->
    <div class="glass">
        ⚡ Run C/C++ code instantly in your browser.<br><br>
        🧠 Beginner Mode explains errors and unsafe functions.<br>
        🚀 Advanced Mode focuses on performance & logic.<br><br>
        💡 AI-powered suggestions help you write better code.
    </div>

    <!-- Button -->
    <button class="btn" onclick="startCoding()">
        🚀 Start Coding
    </button>

</div>

<script>
function startCoding(){
    window.location.href="editor.html";
}
</script>

</body>
</html>
